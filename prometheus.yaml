# Global configurations apply to all contexts unless overridden
global:
  scrape_interval: 15s     # How frequently to scrape targets (default is 1m)
  evaluation_interval: 15s # How frequently to evaluate rules (default is 1m)
  scrape_timeout: 10s      # Timeout for individual scrape requests

# Rule files specifies a list of files from which alerting and recording rules are loaded
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Alerting specifies settings related to Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Scrape configurations control what resources Prometheus monitors
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  #
  - job_name: "etcd"
    static_configs:
        - targets: ["etcd-1:2381"]
  # - job_name: "prometheus"
  #   static_configs:
  #     - targets: ["localhost:9090"]
  #
  # # Example of adding an external target (like a Node Exporter)
  # - job_name: "node_exporter"
  #   static_configs:
  #     - targets: ["192.168.1.50:9100"]
