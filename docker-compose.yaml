  etcd-1:
    image:  gcr.io/etcd-development/etcd:v3.7.0
    env_file: ./etcd.env
    environment:
      ETCD_NAME: "postgres-1"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "https://etcd-1:2380"
      ETCD_ADVERTISE_CLIENT_URLS: "https://etcd-1:2379"
      # ALLOW_NONE_AUTHENTICATION: yes
      # ETCD_INITIAL_ADVERTISE_PEER_URLS: "https://postgres-1:2380"
      # ETCD_ADVERTISE_CLIENT_URLS: "https://postgres-1:2379"
    volumes:
      - ./certs/ca.crt:/etc/etcd/ssl/ca.crt
      - ./certs/etcd-node1.crt:/etc/etcd/ssl/etcd.crt
      - ./certs/etcd-node1.key:/etc/etcd/ssl/etcd.key
    networks:
      - backend
    ports:
      - 2381:2381

  etcd-2:
    image:  gcr.io/etcd-development/etcd:v3.7.0
    env_file: ./etcd.env
    environment:
      ETCD_NAME: "postgres-2"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "https://etcd-2:2380"
      ETCD_ADVERTISE_CLIENT_URLS: "https://etcd-2:2379"
      # ETCD_INITIAL_ADVERTISE_PEER_URLS: "https://postgres-2:2380"
      # ETCD_ADVERTISE_CLIENT_URLS: "https://postgres-2:2379"
    volumes:
      - ./certs/ca.crt:/etc/etcd/ssl/ca.crt
      - ./certs/etcd-node2.crt:/etc/etcd/ssl/etcd.crt
      - ./certs/etcd-node2.key:/etc/etcd/ssl/etcd.key
    networks:
      - backend

  etcd-3:
    image:  gcr.io/etcd-development/etcd:v3.7.0
    env_file: ./etcd.env
    environment:
      ETCD_NAME: "postgres-3"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "https://etcd-3:2380"
      ETCD_ADVERTISE_CLIENT_URLS: "https://etcd-3:2379"
      # ETCD_INITIAL_ADVERTISE_PEER_URLS: "https://postgres-3:2380"
      # ETCD_ADVERTISE_CLIENT_URLS: "https://postgres-3:2379"
    volumes:
      - ./certs/ca.crt:/etc/etcd/ssl/ca.crt
      - ./certs/etcd-node3.crt:/etc/etcd/ssl/etcd.crt
      - ./certs/etcd-node3.key:/etc/etcd/ssl/etcd.key
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090" # Exposes the Prometheus web UI to http://localhost:9090
    volumes:
      # Bind-mount the config file into the container
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      # Named volume to persist data across container restarts
      # - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--log.level=error'
    # network_mode: host
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    # volumes:
    #   - grafana_data:/var/lib/grafana
    environment:
      - GF_LOG_LEVEL=error
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin # Change this for production environments
    # network_mode: host
    restart: unless-stopped
    networks:
      - backend


