global
    # Log to local syslog (assuming rsyslog is configured)
    log         127.0.0.1 local2

    # chroot      /var/lib/haproxy
    # pidfile     /var/run/haproxy.pid
    maxconn     4000
    # user        haproxy
    # group       haproxy
    daemon

    # Turn on runtime API management socket
    stats socket /var/lib/haproxy/stats mode 660 level admin expose-fd listeners
    stats timeout 30s

    # Modern TLS defaults
    ssl-default-bind-ciphers       ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options      no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets

defaults
    log                     global
    mode                    http
    option                  httplog
    option                  dontlognull
    option                  http-server-close
    option                  forwardfor      except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000

# Optional: Basic frontend & backend example skeleton
frontend main
    bind *:80
    # bind *:443 ssl crt /etc/ssl/certs/your_domain.pem alpn h2,http/1.1
    default_backend             app_servers

backend app_servers
    balance     roundrobin
    server      app1 127.0.0.1:8080 check
    server      app2 127.0.0.1:8081 check
